<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Alerta Naranja - Menú</title>

    <link
        rel="stylesheet"
        href="css/menu.css"
    >


    <!-- =================================================
         ESTILO DE LA RULETA
    ================================================== -->

    <style>

        .ruleta{

            overflow:visible !important;

            display:flex !important;

            align-items:center !important;

            justify-content:center !important;

            background:transparent !important;
        }


        .ruleta-visual{

            position:relative;

            width:180px;

            height:180px;

            border-radius:50%;

            border:6px solid #111;

            background:
                conic-gradient(

                    #ffb000 0deg 72deg,

                    #17232a 72deg 144deg,

                    #ffb000 144deg 216deg,

                    #17232a 216deg 288deg,

                    #ffb000 288deg 360deg

                );

            box-shadow:

                0 0 0 3px #ffd53d,

                0 8px 20px rgba(0,0,0,.65),

                0 0 30px rgba(255,180,0,.35);

            transform:rotate(0deg);

            transition:

                transform 4.2s

                cubic-bezier(
                    .12,
                    .75,
                    .18,
                    1
                );

            pointer-events:none;
        }


        .ruleta-visual::after{

            content:"";

            position:absolute;

            left:50%;

            top:50%;

            width:42px;

            height:42px;

            transform:
                translate(
                    -50%,
                    -50%
                );

            border-radius:50%;

            background:
                radial-gradient(
                    circle,
                    #ffe66b,
                    #f39a00 65%,
                    #8b4300
                );

            border:4px solid #151515;

            box-shadow:
                0 3px 8px rgba(0,0,0,.55);

        }


        .ruleta-premio{

            position:absolute;

            left:50%;

            top:50%;

            width:65px;

            text-align:center;

            transform:
                translate(-50%,-50%);

            color:#111;

            font-size:13px;

            line-height:1;

            font-weight:1000;

            z-index:3;
        }


        .ruleta-premio.p1{
            transform:
                rotate(36deg)
                translateY(-62px)
                rotate(-36deg)
                translateX(-50%);
        }

        .ruleta-premio.p2{
            transform:
                rotate(108deg)
                translateY(-62px)
                rotate(-108deg)
                translateX(-50%);
        }

        .ruleta-premio.p3{
            transform:
                rotate(180deg)
                translateY(-62px)
                rotate(-180deg)
                translateX(-50%);
        }

        .ruleta-premio.p4{
            transform:
                rotate(252deg)
                translateY(-62px)
                rotate(-252deg)
                translateX(-50%);
        }

        .ruleta-premio.p5{
            transform:
                rotate(324deg)
                translateY(-62px)
                rotate(-324deg)
                translateX(-50%);
        }


        .puntero-ruleta{

            position:absolute;

            left:50%;

            top:-17px;

            transform:
                translateX(-50%);

            width:0;

            height:0;

            border-left:
                12px solid transparent;

            border-right:
                12px solid transparent;

            border-top:
                24px solid #ff3030;

            filter:
                drop-shadow(
                    0 3px 3px #000
                );

            z-index:10;

            pointer-events:none;
        }


        .ruleta-girando{

            pointer-events:none !important;

            cursor:wait !important;
        }


        .premio{

            position:absolute;

            z-index:200;

            opacity:0;

            transform:
                translateY(10px)
                scale(.92);

            transition:
                opacity .35s ease,
                transform .35s ease;

            font-size:23px;

            font-weight:1000;

            color:#ffd43d;

            text-shadow:
                0 3px 8px #000;
        }


        .premio.mostrar{

            opacity:1;

            transform:
                translateY(0)
                scale(1);
        }


        @media(max-width:700px){

            .ruleta-visual{

                width:145px;

                height:145px;
            }

            .ruleta-visual::after{

                width:34px;

                height:34px;
            }

            .ruleta-premio{

                font-size:11px;
            }
        }

    </style>

</head>


<body>


<main class="menu">


    <!-- FONDO ORIGINAL -->

    <img
        src="img/menu-purace.png"
        alt="Menú Alerta Naranja Volcán Puracé"
        class="imagen-menu"
    >


    <!-- CONTADOR DE MONEDAS -->

    <div
        id="contador-monedas"
        class="contador-monedas"
    >

        🪙

        <span id="monedas">
            50
        </span>

    </div>


    <!-- JUEGO 1 -->

    <button
        id="juego1"
        class="zona juego1"
        aria-label="Trivia de prevención"
    >
    </button>


    <!-- JUEGO 2 -->

    <button
        id="juego2"
        class="zona juego2"
        aria-label="Huyendo a un lugar seguro"
    >
    </button>


    <!-- JUEGO 3 -->

    <button
        id="juego3"
        class="zona juego3"
        aria-label="Memoria de emergencia"
    >
    </button>


    <!-- =================================================
         RULETA
    ================================================== -->

    <button
        id="ruleta"
        class="zona ruleta"
        aria-label="Girar ruleta"
    >

        <span class="puntero-ruleta"></span>

        <span
            id="ruletaVisual"
            class="ruleta-visual"
        >

            <span class="ruleta-premio p1">
                +5
            </span>

            <span class="ruleta-premio p2">
                +10
            </span>

            <span class="ruleta-premio p3">
                +15
            </span>

            <span class="ruleta-premio p4">
                +20
            </span>

            <span class="ruleta-premio p5">
                +25
            </span>

        </span>

    </button>


    <!-- SALIR -->

    <button
        id="salir"
        class="zona salir"
        aria-label="Salir del juego"
    >
    </button>


    <!-- PREMIO -->

    <div
        id="premio"
        class="premio"
    ></div>


</main>


<script src="js/menu.js"></script>

</body>

</html>
